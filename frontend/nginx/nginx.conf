server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: upstream-имена резолвятся заново, чтобы пересоздание
    # контейнеров (новый IP) не приводило к 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nocobase_upstream http://nocobase-app:13000;
    set $backend_upstream http://sk-diagnostic-backend:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $nocobase_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS is terminated by the public reverse proxy before this container.
        # NocoBase 2.2 validates sign-in Origin against these forwarded values.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /backend/ {
        rewrite ^/backend/(.*)$ /api/v1/$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
